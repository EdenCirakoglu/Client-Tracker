services:
  postgres:
    image: postgres:16-alpine
    container_name: clientops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clientops
      POSTGRES_PASSWORD: clientops_dev_password
      POSTGRES_DB: clientops_tracker
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clientops -d clientops_tracker']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
