services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clientops
      POSTGRES_PASSWORD: clientops_dev_password
      POSTGRES_DB: clientops_demo
    ports:
      - '5432:5432'
    volumes:
      - demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clientops -d clientops_demo']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  demo_data:
