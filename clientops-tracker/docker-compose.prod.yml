services:
  api:
    image: ghcr.io/${GHCR_OWNER:-edencirakoglu}/${GHCR_REPOSITORY:-client-tracker}-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the container database address}
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS browser origin}
      SESSION_SECRET: ${SESSION_SECRET:?Set a unique production session secret}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-1800}
      SESSION_ABSOLUTE_SECONDS: ${SESSION_ABSOLUTE_SECONDS:-28800}
      TRUST_PROXY: '1'
      DEMO_MODE: 'false'
      SMTP_MODE: smtp
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '8080'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/${GHCR_OWNER:-edencirakoglu}/${GHCR_REPOSITORY:-client-tracker}-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - '${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-80}:80'
      - '${HTTP_BIND:-127.0.0.1}:${HTTPS_PORT:-443}:443'
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERTS_DIR:?Set a directory containing fullchain.pem and privkey.pem}:/etc/nginx/tls:ro
    healthcheck:
      # Local liveness only; external acceptance must validate the trusted certificate.
      test:
        [
          'CMD-SHELL',
          'wget --no-check-certificate -qO- https://127.0.0.1/api/health >/dev/null || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
